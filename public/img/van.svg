<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="A waste collection van loaded with bags and an old sofa, with a registered carrier badge">
  <defs>
    <linearGradient id="vb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c5ae0"/><stop offset="1" stop-color="#1747d8"/></linearGradient>
    <linearGradient id="vy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe14d"/><stop offset="1" stop-color="#ffd400"/></linearGradient>
    <pattern id="tape" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="24" fill="#ffd400"/><rect x="12" width="12" height="24" fill="#0a2259"/></pattern>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <circle cx="290" cy="190" r="170" fill="#fff" opacity=".07"/>
  <circle cx="290" cy="190" r="118" fill="#fff" opacity=".07"/>
  <rect x="20" y="318" width="520" height="8" rx="4" fill="#fff" opacity=".18"/>
  <g stroke="#fff" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"><path d="M28 230h46M14 258h60M36 286h38"/></g>
  <g filter="url(#s)">
    <!-- load: bags and a sofa -->
    <path d="M150 150c-6-22 10-40 30-36 6-16 32-16 38 2 20-4 32 14 26 34z" fill="#94a3b8"/>
    <path d="M196 120l6-10 8 10" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <rect x="236" y="104" width="118" height="54" rx="12" fill="#c2410c"/>
    <rect x="228" y="122" width="22" height="40" rx="8" fill="#9a3412"/>
    <rect x="340" y="122" width="22" height="40" rx="8" fill="#9a3412"/>
    <path d="M250 120h90" stroke="#fdba74" stroke-opacity=".5" stroke-width="4"/>
    <path d="M368 154c-4-18 8-30 22-28 6-12 26-10 28 4 14 0 22 12 18 24z" fill="url(#vy)"/>
    <!-- body -->
    <rect x="120" y="156" width="330" height="116" rx="10" fill="url(#vb)"/>
    <rect x="120" y="236" width="330" height="18" fill="url(#tape)"/>
    <path d="M150 180h270M150 206h270" stroke="#fff" stroke-opacity=".18" stroke-width="5"/>
    <!-- cab -->
    <path d="M450 186h50c8 0 14 4 18 11l20 34c3 5 4 9 4 14v27H450z" fill="#f1f5ff"/>
    <path d="M462 198h36l18 32h-54z" fill="#60a5fa"/>
    <rect x="450" y="248" width="92" height="10" fill="url(#tape)"/>
    <rect x="528" y="258" width="16" height="10" rx="3" fill="#ffd400"/>
    <rect x="104" y="262" width="446" height="16" rx="6" fill="#1e293b"/>
  </g>
  <g>
    <circle cx="190" cy="282" r="34" fill="#111a2e"/><circle cx="190" cy="282" r="14" fill="#c7d2e3"/>
    <circle cx="470" cy="282" r="34" fill="#111a2e"/><circle cx="470" cy="282" r="14" fill="#c7d2e3"/>
  </g>
  <!-- badge -->
  <g transform="translate(36 58)" filter="url(#s)">
    <rect width="178" height="62" rx="8" fill="#fff"/>
    <circle cx="32" cy="31" r="17" fill="#16a34a"/>
    <path d="M24 31l6 6 11-12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="27" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#0a2259">Registered</text>
    <text x="58" y="45" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#55657a">waste carrier</text>
  </g>
  <g transform="translate(404 40)" filter="url(#s)">
    <rect width="128" height="76" rx="8" fill="#fff"/>
    <text x="64" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#55657a">Booked for</text>
    <text x="64" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="27" font-weight="800" fill="#0a2259">£70</text>
  </g>
</svg>
